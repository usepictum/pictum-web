name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish @pictum/web to npm
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(pnpm pkg get version)"
          if [ "v${package_version}" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi

      - name: Publish package
        run: pnpm publish --no-git-checks --provenance --access public
