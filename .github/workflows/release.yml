name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  integrate:
    name: Pre-release checks
    uses: ./.github/workflows/integrate.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  changelog:
    name: Generate changelog
    runs-on: ubuntu-24.04
    needs: integrate
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get current tag
        id: current
        run: |
          tag="$(git describe \
            --tags \
            --abbrev=0 \
            --match 'v[0-9]*' \
            2>/dev/null || true)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        env:
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="$(pnpm exec git-cliff \
            --config .github/changelog.cliff.toml \
            --bumped-version)"

          if [ -z "$tag" ]; then
            echo "::error::git-cliff could not determine the next version."
            exit 1
          fi

          if [ "$tag" = "$CURRENT_TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes found."
            exit 0
          fi

          version="${tag#v}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate full changelog
        if: steps.version.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pnpm exec git-cliff \
            --config .github/changelog.cliff.toml \
            --tag "$TAG" \
            --output CHANGELOG.md

      - name: Generate release notes
        if: steps.version.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pnpm exec git-cliff \
            --config .github/release-notes.cliff.toml \
            --unreleased \
            --tag "$TAG" \
            --strip all \
            --output RELEASE_NOTES.md

      - name: Upload changelog artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release @pictum/web
    runs-on: ubuntu-24.04
    needs: changelog
    if: needs.changelog.outputs.released == 'true'
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Update package version
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: pnpm version "$VERSION" --no-git-checks --no-git-tag-version

      - name: Download changelog artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog

      - name: Configure release signing
        env:
          SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
        run: |
          signing_key="$RUNNER_TEMP/release-signing-key"
          allowed_signers="$RUNNER_TEMP/allowed-signers"

          printf '%s\n' "$SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          public_key="$(ssh-keygen -y -f "$signing_key")"
          printf '%s %s\n' "$SIGNING_EMAIL" "$public_key" > "$allowed_signers"

          git config user.name "$SIGNING_NAME"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git config gpg.ssh.allowedSignersFile "$allowed_signers"

      - name: Create release commit and tag
        env:
          TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          git add CHANGELOG.md package.json pnpm-lock.yaml
          git diff --cached --check
          git commit \
            --gpg-sign \
            --message "chore(release): $TAG" \
            --message "[skip ci]"
          git tag --sign --message "Release $TAG" "$TAG"
          git verify-commit HEAD
          git verify-tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          token: ${{ steps.release-token.outputs.token }}
